<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Absolute PC</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body class="login-page">
    <div class="login-card">
        <a href="/app/index.html" class="login-back"><i class="fas fa-arrow-left"></i> На главную</a>

        <div class="login-card__brand">
            <i class="fas fa-desktop"></i>
            <h1>Absolute PC</h1>
            <p>Вход в личный кабинет</p>
        </div>

        <form id="userLoginForm">
            <div class="login-field">
                <label for="username">Email или логин</label>
                <input type="text" id="username" name="username" required placeholder="user@absolutepc.ru"
                    autocomplete="username">
            </div>
            <div class="login-field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    autocomplete="current-password">
            </div>
            <div class="login-options">
                <label><input type="checkbox" id="remember"> Запомнить меня</label>
                <a href="#">Забыли пароль?</a>
            </div>
            <button type="submit" class="login-submit">Войти</button>
            <div class="login-error" id="loginError"></div>
        </form>

        <div class="login-footer">
            Нет аккаунта? <a href="#">Зарегистрироваться</a>
        </div>

        <div class="login-hint">
            Демо-доступ: <strong>user@absolutepc.ru</strong> / <strong>user123</strong><br>
            Админ-панель: <a href="/admin.html">вход для администратора</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('userLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const result = Auth.login({ username, password });

            if (result.ok) {
                if (result.role === 'admin') {
                    location.href = '/login.html';
                } else {
                    location.href = '/app/index.html';
                }
                return;
            }

            errorEl.textContent = result.error;
            errorEl.classList.add('is-visible');
        });

        if (Auth.isAuthenticated() && Auth.getRole() === 'user') {
            location.href = '/app/index.html';
        }
    </script>
    <script src="/js/mobile-nav.js"></script>
    <script src="/shop.js"></script>
</body>

</html>
